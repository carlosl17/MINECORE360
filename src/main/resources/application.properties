
# ===========================================
# MINECORE 360 - ELECTRO DATA S.A.C.
# CONFIGURACION LOCAL Y NUBE
# ===========================================

# Nombre de la aplicacion
spring.application.name=minecore360

# Puerto local 8081 / Puerto del hosting
server.port=${PORT:8081}
server.address=0.0.0.0

# Base de datos MySQL
# Local: localhost:3306/minecore360_db
# Nube: configuracion mediante variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:minecore360_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=true

# Codificacion
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true